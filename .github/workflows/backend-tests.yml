name: Pruebas del backend

on:
  push:
    branches:
      - master
      - S3-esqueleto-ejecutable
      - S4-corte-vertical
      - S7-interfaces-contratos
      - S7-ajustes-finales-contrato
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt

      - name: Ejecutar pruebas funcionales y arquitectónicas
        run: >-
          python -m pytest backend/tests -q
          --ignore=backend/tests/test_contrato_openapi.py

      - name: Ejecutar prueba de contrato OpenAPI
        run: python -m pytest backend/tests/test_contrato_openapi.py -q
