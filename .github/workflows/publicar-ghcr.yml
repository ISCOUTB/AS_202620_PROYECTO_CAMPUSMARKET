name: Preparar publicacion GHCR

on:
  push:
    branches: [feat/web-institucional-20261030-40be256]
    paths: [scripts/publicar_web_verificada.py, scripts/test_publicar_web_verificada.py, .github/workflows/publicar-ghcr.yml]
  workflow_dispatch:
    inputs:
      imagen:
        description: "Imagen acreditada a recuperar (Web publica solo candidato en el fork)"
        required: true
        default: compose
        type: choice
        options: [compose, web-institucional]
      run_id:
        description: "Run de Compose que produjo la imagen"
        required: true
        type: string
      source_sha:
        description: "SHA completo del codigo construido"
        required: true
        type: string
      publicar:
        description: "Publicar imagen verificada en GHCR"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  checks: read
  packages: write

jobs:
  verificar-artefacto:
    if: inputs.imagen != 'web-institucional' && github.repository == 'ISCOUTB/AS_202620_PROYECTO_CAMPUSMARKET' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validar procedencia del run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" |
            jq -e --arg sha "$SOURCE_SHA" '
              .head_sha == $sha and
              .event == "push" and
              .head_branch == "master" and
              .conclusion == "success" and
              (.path | endswith(".github/workflows/compose-mvp.yml"))
            ' >/dev/null

          echo "Run Compose aprobado y SHA verificado."

      - name: Autorizar commit para publicacion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail


          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/check-runs?per_page=100" \
            --jq '.check_runs[] | [.name, .status, .conclusion, .head_sha, .app.slug] | @tsv' \
            > "$RUNNER_TEMP/campusmarket-checks.tsv"

          python3 - <<'PY'
          import os
          from pathlib import Path

          expected_sha = os.environ["SOURCE_SHA"]
          required = {
              "compose",
              "test",
              "frontend",
              "Flujo android",
              "Flujo web-desktop",
              "Flujo web-mobile",
              "contrato-publico",
              "SonarCloud Code Analysis",
          }

          rows = []
          path = Path(os.environ["RUNNER_TEMP"]) / "campusmarket-checks.tsv"
          for line in path.read_text(encoding="utf-8").splitlines():
              fields = line.split("\t")
              if len(fields) == 5:
                  rows.append(fields)

          for name in sorted(required):
              expected_app = (
                  "sonarqubecloud"
                  if name == "SonarCloud Code Analysis"
                  else "github-actions"
              )
              matches = [
                  row for row in rows
                  if row[0] == name
                  and row[3] == expected_sha
                  and row[4] == expected_app
              ]
              if len(matches) != 1 or any(
                  row[1] != "completed" or row[2] != "success"
                  for row in matches
              ):
                  raise SystemExit(
                      f"Check requerido no aprobado: {name}"
                  )

          print("Checks de GitHub Actions aprobados.")
          PY
      - name: Recuperar imagen probada
        uses: actions/download-artifact@v4
        with:
          name: campusmarket-imagen-${{ inputs.source_sha }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: imagen-verificada

      - name: Comprobar identidad de la imagen recuperada
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -f imagen-verificada/api.tar
          test -f imagen-verificada/source-sha.txt
          test "$(cat imagen-verificada/source-sha.txt)" = "$SOURCE_SHA"

          IMAGE_CONFIG="$(python3 - <<'PY'
          import json, tarfile
          with tarfile.open("imagen-verificada/api.tar") as archive:
              manifest = json.load(archive.extractfile("manifest.json"))
              assert len(manifest) == 1
              print(manifest[0]["Config"].split("/")[-1].removesuffix(".json"))
          PY
          )"

          [[ "$IMAGE_CONFIG" =~ ^[0-9a-f]{64}$ ]]
          docker load -i imagen-verificada/api.tar
          IMAGE_ID="sha256:$IMAGE_CONFIG"
          docker image inspect "$IMAGE_ID" >/dev/null
          echo "Imagen cargada e identificada: $IMAGE_ID"

          OCI="$(docker image inspect "$IMAGE_ID" \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          FILE="$(docker run --rm --entrypoint cat "$IMAGE_ID" /app/REVISION)"

          test "$OCI" = "$SOURCE_SHA"
          test "$FILE" = "$SOURCE_SHA"

          echo "ARTEFACTO VERIFICADO: $SOURCE_SHA"
          echo "VERIFIED_IMAGE_ID=$IMAGE_ID" >> "$GITHUB_ENV"
          echo "Imagen validada y lista para publicacion."
      - name: Publicar imagen verificada en GHCR
        if: inputs.publicar == true
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/iscoutb/campusmarket-api"
          TAG="$IMAGE:$SOURCE_SHA"

          test -n "${VERIFIED_IMAGE_ID:-}"
          docker image inspect "$VERIFIED_IMAGE_ID" >/dev/null

          echo "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin

          docker tag "$VERIFIED_IMAGE_ID" "$TAG"
          docker push "$TAG" | tee "$RUNNER_TEMP/ghcr-push.log"

          DIGEST="$(sed -nE \
            's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' \
            "$RUNNER_TEMP/ghcr-push.log" | tail -n 1)"

          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

          docker buildx imagetools inspect "$IMAGE@$DIGEST" >/dev/null

          docker pull "$IMAGE@$DIGEST"

          REMOTE_ID="$(docker image inspect "$IMAGE@$DIGEST" \
            --format '{{.Id}}')"

          test "$REMOTE_ID" = "$VERIFIED_IMAGE_ID"

          OCI="$(docker image inspect "$IMAGE@$DIGEST" \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"

          FILE="$(docker run --rm --entrypoint cat \
            "$IMAGE@$DIGEST" /app/REVISION)"

          test "$OCI" = "$SOURCE_SHA"
          test "$FILE" = "$SOURCE_SHA"

          echo "## Publicacion GHCR verificada" >> "$GITHUB_STEP_SUMMARY"
          echo "- Fuente: \`$SOURCE_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Imagen: \`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Identidad OCI, archivo REVISION e imagen remota: OK" >> "$GITHUB_STEP_SUMMARY"

          echo "GHCR_VERIFICADO=$IMAGE@$DIGEST"

  verificar-web:
    if: (github.event_name == 'push' || inputs.imagen == 'web-institucional') && github.repository == 'Nnigarp/AS_202620_PROYECTO_CAMPUSMARKET' && github.ref == 'refs/heads/feat/web-institucional-20261030-40be256'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Validar publicador y seleccion exacta del candidato
        env:
          RUN_ID: ${{ inputs.run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python -m unittest scripts.test_publicar_web_verificada -v
          python - <<'PY'
          import os
          from scripts.publicar_web_verificada import RUN, SOURCE
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              assert os.environ["RUN_ID"] == str(RUN)
              assert os.environ["SOURCE_SHA"] == SOURCE
          PY
      - name: Recuperar y verificar la imagen original sin construir
        if: >-
          inputs.publicar != true && !(github.event_name == 'push' && github.event.head_commit.message == 'ci: publicar solo candidato Web a9b6709 verificado sin desplegar')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.publicar_web_verificada
      - name: Publicar exclusivamente el candidato original en GHCR del fork
        if: >-
          inputs.publicar == true || (github.event_name == 'push' && github.event.head_commit.message == 'ci: publicar solo candidato Web a9b6709 verificado sin desplegar')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.publicar_web_verificada --publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: publicacion-web-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/publicacion-web/
          if-no-files-found: error
          retention-days: 90
